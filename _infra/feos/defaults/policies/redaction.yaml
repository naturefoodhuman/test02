# 创建/修改该文件的LLM大模型：Arena.ai Agent Mode - Execution Lead Engineer
# 创建时间（北京时间）：2026-07-01 00:00:00

profile: "default_redaction"

redaction:
  mode: "deterministic_first"
  placeholder_format: "<<{entity_type}_{index}>>"
  preserve_code_structure: true
  preserve_stacktrace_shape: true
  scan_layers:
    - regex
    - secret_recognizer
    - pii_recognizer
    - canary
  deny_patterns:
    - "api[_-]?key"
    - "secret"
    - "token"
    - "password"
  allowed_after_redaction:
    - stack_trace
    - git_diff
    - config_excerpt
    - test_output
