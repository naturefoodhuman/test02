# ⚠️ 注意：本文件已根据 config/models.yaml 彻底重构。
# 所有的 model_name 必须与 A 文件保持 100% 一致。

model_list:
  # ── MTPLX 高性能本地推理 (主大脑/编码) ──────────────────────────
  - model_name: "mtplx-qwen36-27b"
