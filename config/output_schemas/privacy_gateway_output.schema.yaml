$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://forge.local/schemas/privacy_gateway_output.schema.json"
title: "FORGE Privacy Gateway Output"
type: object
additionalProperties: false
required:
  - text
  - mapping_id
  - entities
properties:
  text:
    type: string
    description: "Redacted text with placeholders only. Must not contain raw PII."
  mapping_id:
    type: string
    minLength: 1
    description: "Identifier for encrypted local PII mapping store."
  entities:
    type: array
    description: "Safe detection metadata. Must not contain original raw PII values."
    items:
      type: object
      additionalProperties: false
      required:
        - type
        - placeholder
      properties:
        type:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
        recognizer:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
  schema_valid:
    type: boolean
  canary_clean:
    type: boolean
