# 创建/修改该文件的LLM大模型：Claude Sonnet 4.5 (via Arena.ai Agent Mode)
# 创建时间（北京时间）：2026-06-21 18:00:00
# config/models.yaml
# A 文件：所有可用模型的接入信息。
# ⚠️ 统一路由：所有本地模型 base_url 均指向 Smart Proxy (4000) 进行显存调度。

models:
  # ── MTPLX 高性能本地推理 ──────────────────────────
  mtplx-qwen36-27b:
    display_name: "Qwen3.6-27B-MTPLX-Optimized (主大脑/编码)"
    provider: mtplx
    backend: mtplx
    model_id: Qwen3.6-27B-MTPLX-Optimized-Quality
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 20

  mtplx-gemma4:
    display_name: "Gemma4-MTPLX-Optimized (独立评审)"
    provider: mtplx
    backend: mtplx
    model_id: Gemma4-MTPLX-Optimized-Quality
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 16

  # ── Ollama 本地推理 ──────────────────────────────────────────
  local-deepseek-r1:
    display_name: "DeepSeek-R1 32B (独立评审)"
    provider: ollama
    backend: ollama
    model_id: deepseek-r1:32b
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 20

  # ── Llama.cpp 本地推理 ────────────────────────────────────────
  qwopus-35b:
    display_name: "Qwopus3.6-35B-A3B (独立评审)"
    provider: llama_cpp
    backend: llama_cpp
    model_id: Qwopus3.6-35B-A3B-v1-MTP-GGUF-8bit
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 36

  local-fast:
    display_name: "Qwen2.5 7B (简单任务)"
    provider: ollama
    backend: ollama
    model_id: qwen2.5:7b
    base_url: http://localhost:11434
    type: local
    memory_required_gb: 6

  # ── 中国商业 API ─────────────────────────────────────────────
  deepseek-pro:
    display_name: "DeepSeek V4 Pro"
    provider: deepseek
    backend: litellm
    model_id: deepseek-ai/DeepSeek-V4-Pro
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    type: api

  deepseek-flash:
    display_name: "DeepSeek V4 Flash"
    provider: deepseek
    backend: litellm
    model_id: deepseek-ai/DeepSeek-V4-Flash
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    type: api
