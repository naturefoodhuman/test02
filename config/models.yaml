    memory_required_gb: 52
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 15

  # ── API 模型：直接访问官方，不经过本地代理 ──
  deepseek-pro:
    display_name: "DeepSeek V4 Pro"
    provider: deepseek
    backend: litellm
    model_id: deepseek-ai/DeepSeek-V4-Pro
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    type: api
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 20

  deepseek-flash:
    display_name: "DeepSeek V4 Flash"
