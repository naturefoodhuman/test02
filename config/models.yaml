# config/models.yaml
# A 文件：所有可用模型的接入信息

models:
  # ── MTPLX 高性能本地推理 (最高优先级) ──────────────────────────
  mtplx-qwen36-27b:
    display_name: "Qwen3.6-27B-MTPLX-Optimized (主大脑/编码)"
    provider: mtplx
    backend: mtplx
    model_id: Qwen3.6-27B-MTPLX-Optimized-Quality
    base_url: http://localhost:8080/v1
    type: local
    estimated_speed: "~80 tok/s"
    memory_required_gb: 18
    capabilities: [general, reasoning, code, high_quality]

  mtplx-gemma4:
    display_name: "Gemma4-MTPLX-Optimized (评审)"
    provider: mtplx
    backend: mtplx
    model_id: Gemma4-MTPLX-Optimized-Quality
    base_url: http://localhost:8082/v1
    type: local
    estimated_speed: "~60 tok/s"
    memory_required_gb: 16
    capabilities: [general, reasoning]

  # ── Ollama 本地推理 ──────────────────────────────────────────
  local-deepseek-r1:
    display_name: "DeepSeek-R1 32B (独立评审)"
    provider: ollama
    backend: ollama
    model_id: deepseek-r1:32b
    base_url: http://localhost:11434
    type: local
    estimated_speed: "~30 tok/s"
    memory_required_gb: 20
    capabilities: [deep_reasoning, strategy]

  local-qwen-coder:
    display_name: "Qwen3-Coder-Next q4_K_M (测试/编码)"
    provider: ollama
    backend: ollama
    model_id: qwen3-coder-next:q4_K_M
    base_url: http://localhost:11434
    type: local
    estimated_speed: "~50 tok/s"
    memory_required_gb: 14
    capabilities: [code_generation, code_review]

  qwopus-35b:
    display_name: "Qwopus3.6-35B-A3B (评审)"
    provider: llama_cpp
    backend: llama_cpp
    model_id: Qwopus3.6-35B-A3B-v1-MTP-GGUF-8bit
    base_url: http://localhost:8084/v1
    type: local
    estimated_speed: "~30 tok/s"
    memory_required_gb: 24
    capabilities: [general, reasoning]

  # ── 其他本地模型 ─────────────────────────────────────────────
  local-qwen35b:
    display_name: "Qwen3.5 35B MoE (本地主力)"
    provider: ollama
    backend: ollama
    model_id: qwen3.5:35b-a3b-q8_0
    base_url: http://localhost:11434
    type: local
    estimated_speed: "~50 tok/s (MLX)"
    memory_required_gb: 22
    capabilities: [general, reasoning, chinese]

  local-fast:
    display_name: "Qwen2.5 7B (快速)"
    provider: ollama
    backend: ollama
    model_id: qwen2.5:7b
    base_url: http://localhost:11434
    type: local
    estimated_speed: "~120 tok/s"
    memory_required_gb: 6
    capabilities: [classify, summarize, route]

  embedding:
    display_name: "bge-m3 (向量嵌入)"
    provider: ollama
    backend: ollama
    model_id: bge-m3
    base_url: http://localhost:11434
    type: embedding

  # ── 中国商业 API ─────────────────────────────────────────────
  deepseek-flash:
    display_name: "DeepSeek V4 Flash (API 快速)"
    provider: deepseek
    backend: litellm
    model_id: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    type: api
    estimated_cost: "$0.002/1k tokens"
    capabilities: [general, reasoning, fast]
    data_policy: requires_privacy_check

  deepseek-pro:
    display_name: "DeepSeek V4 Pro (API 高质量)"
    provider: deepseek
    backend: litellm
    model_id: deepseek-reasoner
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    type: api
    estimated_cost: "$0.015/1k tokens"
    capabilities: [deep_reasoning, high_quality]
    data_policy: requires_privacy_check

  qwen-plus:
    display_name: "Qwen 3.6 Plus (API 超长上下文)"
    provider: alibaba
    backend: litellm
    model_id: qwen-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${QWEN_API_KEY}
    type: api
    estimated_cost: "$0.005/1k tokens"
    capabilities: [long_context, chinese]
    data_policy: requires_privacy_check

  glm-5:
    display_name: "GLM-5.1 (API 中文专项)"
    provider: zhipu
    backend: litellm
    model_id: glm-4-plus
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${GLM_API_KEY}
    type: api
    estimated_cost: "$0.007/1k tokens"
    capabilities: [chinese, legal]
    data_policy: requires_privacy_check
