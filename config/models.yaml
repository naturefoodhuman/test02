# config/models.yaml

models:
  # ── 本地模型：统一由 Smart Proxy (4000) 调度 ──
  mtplx-qwen36-27b:
    display_name: "Qwen3.6-27B-MTPLX-Optimized (主大脑)"
    provider: mtplx
    backend: mtplx
    model_id: Qwen3.6-27B-MTPLX-Optimized-Quality
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 20
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 15

  mtplx-gemma4:
    display_name: "Gemma4-MTPLX-Optimized (独立评审)"
    provider: mtplx
    backend: mtplx
    model_id: Gemma4-MTPLX-Optimized-Quality
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 16
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 10
    

  qwopus-35b:
    display_name: "Qwopus3.6-35B-A3B (独立评审)"
    provider: llama_cpp
    backend: llama_cpp
    model_id: Qwopus3.6-35B-A3B-v1-MTP-GGUF-8bit
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 36
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 15

  local-deepseek-r1:
    display_name: "DeepSeek-R1 32B"
    provider: ollama
    backend: ollama
    model_id: deepseek-r1:32b
    base_url: http://localhost:4000/v1
    type: local
    memory_required_gb: 20
    tools: [file_read, file_write, shell_exec, list_directory]
    max_agent_turns: 15

  qwen3-coder-next:
    display_name: "Qwen3-Coder-Next Q4_K_M (coding test)"
    provider: ollama
    backend: ollama
    model_id: qwen3-coder-next:q4_K_M
    base_url: http://localhost:4000/v1
