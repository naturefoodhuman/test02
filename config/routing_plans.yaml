# 创建/修改该文件的LLM大模型：Claude Sonnet 4.5 (via Arena.ai Agent Mode)
# 创建时间（北京时间）：2026-06-20 15:30:00
# config/routing_plans.yaml
# B 文件：各节点模型调用方案
# 切换方案只改 active_plan 这一个字段
# SSOT: 必须与 config/models.yaml 中的模型 ID 严格对应

active_plan: mtplx-hybrid

plans:
  # ── 默认方案：高性能本地混合 (主大脑 Qwen + 独立评审 Gemma4) ─────────────────
  default:
    description: "高性能本地混合，使用 MTPLX 优化引擎"
    estimated_total_time: "约 5-8 分钟"
    estimated_cost: "$0"
    nodes:
      primary_expert:
        model: mtplx-qwen36-27b
        note: "主分析，MTPLX 优化版 Qwen"
      reviewer_1:
        model: mtplx-gemma4
        role: "风险评估"
        execution: sequential
        note: "独立评审，高性能本地模型"
      reviewer_2:
        model: local-deepseek-r1
        role: "合规审查"
        execution: sequential
        note: "本地推理模型，深度分析"
      reviewer_3:
        model: mtplx-gemma4
        role: "执行策略"
        execution: sequential
        note: "独立视角"
      consensus:
        model: mtplx-qwen36-27b
        note: "主大脑汇总"
      fast_classify:
        model: local-fast

  # ── MTPLX 高性能混合方案 (专为 M1 Max 64GB 优化) ──────────────────────────
  mtplx-hybrid:
    description: "MTPLX 高性能本地混合（主大脑 Qwen + 独立评审 Gemma4，并行）"
    estimated_total_time: "约 5-8 分钟"
    estimated_cost: "$0"
    notes: "专为 M1 Max 64GB 硬件优化，使用 8080/8082 MTPLX 端口。"
    nodes:
      primary_expert:
        model: mtplx-qwen36-27b
        note: "主大脑 / 编码"
      reviewer_1:
        model: mtplx-gemma4
        role: "风险评估"
        execution: parallel
        note: "独立评审"
      reviewer_2:
        model: mtplx-gemma4
        role: "合规审查"
        execution: parallel
        note: "独立评审"
      consensus:
        model: mtplx-qwen36-27b
        note: "高质量模型做最终决断"
      fast_classify:
        model: local-fast

  # ── 高质量方案：外源 API 增强评审质量 ──────────────────────────────────────
  high-quality:
    description: "本地主大脑 + 多外源 API 独立并行评审"
    estimated_total_time: "约 8-12 分钟"
    estimated_cost: "$0.05-0.15/次"
    nodes:
      primary_expert:
        model: mtplx-qwen36-27b
      reviewer_1:
        model: deepseek-pro
        role: "深度推理评审"
        execution: parallel
      reviewer_2:
        model: deepseek-flash
        role: "快速风险评审"
        execution: parallel
      reviewer_3:
        model: qwen-plus
        role: "中文法律专项"
        execution: parallel
      consensus:
        model: deepseek-pro
        note: "高质量外源模型做最终决断"
      fast_classify:
        model: local-fast

  # ── 全本地方案：零成本，Ollama 驱动 ────────────────────────────────────────
  all-local:
    description: "全部 Ollama 本地模型，零 API 成本"
    estimated_total_time: "约 18-25 分钟"
    estimated_cost: "$0"
    nodes:
      primary_expert:
        model: local-qwen35b
      reviewer_1:
        model: local-deepseek-r1
        role: "风险评估"
        execution: sequential_isolated
      reviewer_2:
        model: local-qwen35b
        role: "合规审查"
        execution: sequential_isolated
      reviewer_3:
        model: local-qwen-coder
        role: "技术可行性"
        execution: sequential_isolated
      consensus:
        model: local-deepseek-r1
      fast_classify:
        model: local-fast

  # ── 深度方案：Llama.cpp 高规格模型 ────────────────────────────────────────
  deep-review:
    description: "主大脑 + 35B 高规格 GGUF 评审"
    estimated_total_time: "约 15-20 分钟"
    estimated_cost: "$0"
    nodes:
      primary_expert:
        model: mtplx-qwen36-27b
      reviewer_1:
        model: qwopus-35b
        role: "高精度评审"
        execution: sequential
      consensus:
        model: mtplx-qwen36-27b
      fast_classify:
        model: local-fast
