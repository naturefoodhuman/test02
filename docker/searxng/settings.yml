use_default_settings: true
general:
  debug: false
  instance_name: "FORGE Google Isolation"
search:
  safe_search: 0
  formats: [html, json]
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false
outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
  proxies:
    "all://":  
      - http://host.docker.internal:7890
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: arxiv
    disabled: false
