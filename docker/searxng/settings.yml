use_default_settings: true
general:
  debug: false
  instance_name: "FORGE Google Isolation"
search:
  safe_search: 0
  formats: [html, json]
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false
outgoing:
  request_timeout: 30.0
  max_request_timeout: 60.0
  proxies:
    all:
      - http://host.docker.internal:7890
engines:
  - name: google
    disabled: false
    weight: 1.0
  - name: bing
    disabled: true
  - name: baidu
    disabled: true
  - name: arxiv
    disabled: true
