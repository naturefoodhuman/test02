# 创建/修改该文件的LLM大模型：Arena.ai Agent Mode - Execution Lead Engineer
# 创建时间（北京时间）：2026-06-25 00:00:00

# FORGE SearXNG Settings v3.0 - Anti-Risk-Control Hardened
# Strategy: keep SearXNG as local primary metasearch, but remove high-risk
# scraping engines from the main pool and prefer stable / API-backed / open-data
# engines under data-center/VPN proxy environments.

use_default_settings:
  engines:
    keep_only:
      - bing
      - mojeek
      - qwant
      - wikipedia
      - duckduckgo
      - github
      - gitlab
      - stackoverflow
      - arxiv
      - crossref
      - pubmed
      - semantic scholar
      - reddit
      - hackernews
      - lobste.rs
      - npm
      - pypi
      - docker hub
      - mdn
      - wolframalpha noapi

general:
  debug: false
  instance_name: "FORGE Resilient Search"
  enable_metrics: true

# 直连场景 (127.0.0.1:8090 无反向代理) 下彻底禁用限流与 botdetection,
# 消除 "X-Forwarded-For nor X-Real-IP header is set!" 警告。
# limiter 已在 server 段关闭,这里再显式禁用 botdetection 模块加载。
limiter: false
botdetection: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats: [html, json]
  max_page: 1

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false
  image_proxy: false
  http_protocol_version: "1.1"
  # 新增:直连场景下禁用 botdetection 的 IP 信任检查
  public_instance: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: false
  useragent_suffix: ""
  proxies:
    "all://":
      - http://host.docker.internal:7890

engines:
  # ---- General search: lower-risk scraping engines ----
  - name: bing
    disabled: true
    timeout: 8.0
    weight: 1

  - name: mojeek
    disabled: true
    timeout: 8.0
    weight: 2

  - name: qwant
    disabled: true
    timeout: 8.0
    weight: 1

  # ---- Knowledge / open APIs ----
  - name: wikipedia
    disabled: false
    timeout: 10.0
    weight: 3

  # wikidata 引擎已移除:其启动期 SPARQL 探测 (query.wikidata.org) 在代理环境下
  # 持续返回 403,导致 init failed 并把整个引擎挂起 180s。功能与 wikipedia 高度
  # 重叠,移除对搜索体验影响极小。如需恢复,需先确保代理出口 IP 不被 wikidata 风控。

  # ---- Academic / research ----
  - name: arxiv
    disabled: false
    timeout: 15.0
    categories: [science, scientific publications]

  - name: crossref
    disabled: false
    timeout: 10.0

  - name: pubmed
    disabled: false
    timeout: 10.0

  - name: semantic scholar
    disabled: false
    timeout: 10.0

  # ---- Code / engineering ----
  - name: github
    disabled: false
    timeout: 10.0
    categories: [it]

  - name: stackoverflow
    disabled: false
    timeout: 10.0
    categories: [it]

  - name: hackernews
    disabled: false
    timeout: 8.0
    categories: [it, news]

  - name: lobste.rs
    disabled: false
    timeout: 8.0

  - name: mdn
    disabled: false
    timeout: 10.0

  - name: reddit
    disabled: true
    timeout: 8.0

  # ---- Package repositories ----
  - name: npm
    disabled: false

  - name: pypi
    disabled: false

  - name: docker hub
    disabled: false

  # ---- Risky scraping engines: disabled by default ----
  - name: duckduckgo
    disabled: true
    timeout: 8.0




categories_as_tabs:
  general:
  it:
  science:
  files:
  news:
