    conditions:
      - {op: eq, field: variables.sex, value: male}
      - {op: eq, field: variables.measure, value: weight_kg}
    action:
      verdict: info
      outputs: {age_months: 0, p3: 2.5, p15: 3.0, p50: 3.3, p85: 3.7, p97: 4.0}
      reason_code: male_weight_0m
      evidence_text: "男 0 月体重百分位锚点"
