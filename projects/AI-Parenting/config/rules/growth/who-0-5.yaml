# 创建/修改该文件的LLM大模型：Claude Opus 4.8
# 创建时间（北京时间）：2026-08-17 00:00:00
#
# 生长规则包（APC-T023）：WHO 0–5 岁百分位参考表（P0 简化 fixture）。
# 依据：FINAL_PRD §11.13（WHO 百分位 0~5 岁，按性别，体重/身长/头围）；
#       ARCHITECTURE_FINAL §10.2（生长规则：WHO 百分位、按性别、趋势提醒）。
#
# ⚠️ 本包为 P0 简化 fixture（关键月龄 P3/P15/P50/P85/P97 锚点，近似值），
#    接口兼容完整 WHO LMS 表——V1 可替换为 LMS 参数精确计算（经 /api/v1/rules 上传新版本）。
#    数值为示例量级（非精确 WHO 表），仅用于 P0 链路验证；上线前须替换为权威 WHO 数据。
#
# 每条 rule = 一个 (sex, measure, age_months) 锚点：
#   conditions: [{op: eq, field: variables.sex, value: <male|female>},
#                {op: eq, field: variables.measure, value: <weight_kg|length_cm|head_circumference_cm>}]
#   action.outputs: age_months + p3/p15/p50/p85/p97（该月龄该指标的百分位值）
#
# 输入（variables）：
#   sex     —— male / female
#   measure —— weight_kg / length_cm / head_circumference_cm
#   value   —— 当前测量值
#   history —— 近 30 天记录（list[dict] 含 age_days+percentile，或 list[float] 百分位序列）

policy_type: growth
region: CN
version: 1
effective_from: 2026-08-17T00:00:00+08:00
source: "WHO 0-5 岁百分位 P0 简化 fixture（PRD §11.13，上线前替换为权威 WHO 数据）"
rule_text: |
  生长规则（PRD §11.13）：
  - WHO 0–5 岁百分位，按性别，体重/身长/头围。
  - 近 30 天趋势，与出生数据对比。
  - 百分位异常变化提醒（变化 ≥25 个百分点）。
  限制：只做趋势提醒，不基于单次记录诊断营养不良或发育异常。
display_text: |
  生长百分位（WHO 0-5 岁，按性别）：体重/身长/头围。趋势提醒，不诊断。
