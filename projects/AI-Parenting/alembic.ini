# 创建/修改该文件的LLM大模型：Claude Opus 4.8
# 创建时间（北京时间）：2026-08-10 00:00:00
#
# alembic.ini —— Alembic 迁移配置。
# 依据：ENGINEERING_DESIGN §4、§7；TASK_BACKLOG APC-T003。
# 设计：script_location 指向 server/migrations；URL 由 env.py 从 Settings 注入（不在此硬编码）。
#       async 迁移逻辑在 env.py。

[alembic]
script_location = server/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://  # 占位，env.py 用 PARENTING_DATABASE__URL 覆盖

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
