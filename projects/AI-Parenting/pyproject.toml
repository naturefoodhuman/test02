[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-parenting-copilot"
version = "0.1.0"
description = "AI Parenting Copilot — 家庭私有化 AI 育儿副驾驶系统（FORGE Factory 孵化项目）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FORGE Factory" }]

dependencies = [
    # Web 框架
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # 数据校验
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    # DB 访问
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # ID
    "python-ulid>=2.2",
    # MQTT
    "aiomqtt>=2.0",
    # 定时任务
    "apscheduler>=3.10",
    # 重试
    "tenacity>=8.2",
    # 缓存（进程内）
    "cachetools>=5.3",
    # 结构化日志
    "structlog>=24.1",
    # 指标
    "prometheus-client>=0.20",
    # 追踪
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    # HTTP 客户端（调用工厂 Smart Proxy）
    "httpx>=0.27",
    # YAML
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.0",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: 行长由 formatter 控制
# RUF001/RUF002/RUF003: 中文注释/文档/字符串中的全角标点（：、（、）、；等）是项目常态
#   （LLM 文件头留痕规则 HANDOFF §7 要求中文），不视为 ambiguous。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.ruff.format]
line-ending = "lf"

# ============================================================
# Mypy
# ============================================================
[tool.mypy]
python_version = "3.11"
namespace_packages = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false  # 渐进式收紧
ignore_missing_imports = true
exclude = ["server/migrations/versions/", "android/", "firmware/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "server.tests.*"
ignore_errors = true

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests", "tests"]
markers = [
    "slow: 标记慢测试（testcontainers / 真实 DB），nightly 才跑",
    "integration: 集成测试（需 DB 或 MQTT）",
    "golden: 规则黄金用例",
    "security: 安全回归",
    "e2e: 端到端",
]
addopts = "-q --strict-markers"
