plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aiparentingcopilot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aiparentingcopilot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // 👇 新增下面这两个配置块，统一使用 Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    // 👆 新增结束
}