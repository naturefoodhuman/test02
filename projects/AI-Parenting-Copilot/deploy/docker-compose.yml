name: ai-parenting-copilot

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parenting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parenting}
      POSTGRES_DB: ${POSTGRES_DB:-parenting}
      POWERSYNC_STORAGE_DB: ${POWERSYNC_STORAGE_DB:-powersync_storage}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parenting} -d ${POSTGRES_DB:-parenting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 2 >/dev/null 2>&1 || nc -z 127.0.0.1 1883"]
      interval: 10s
      timeout: 5s
      retries: 6

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      POWERSYNC_LOG_LEVEL: ${POWERSYNC_LOG_LEVEL:-info}
    ports:
      - "${POWERSYNC_PORT:-8080}:8080"
    volumes:
      - ./powersync/service.yaml:/config/service.yaml:ro
      - ./powersync/sync-config.yaml:/config/sync-config.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
