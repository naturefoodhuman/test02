cases:
  - name: young_infant_fever_red
    domain: triage
    input:
      baby_age_months: 2
      temperature_c: 38.1
    expect:
      verdict: alert
      alert_level: red
      reason_code: young_infant_fever_redline
  - name: mmwave_cannot_red
    domain: thresholds
    input:
      source: mmwave
      requested_level: red
      consecutive_days: 1
      deviation_percent: 50
    expect:
      verdict: block
      reason_code: mmwave_no_red_single_signal
