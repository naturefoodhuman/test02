config:
  edition: 3

streams:
  family_observation_events:
    auto_subscribe: true
    queries:
      - SELECT * FROM observation_event WHERE family_id = request.user_id() AND is_deleted = false
  family_derived_state:
    auto_subscribe: true
    queries:
      - SELECT * FROM derived_baby_state WHERE family_id = request.user_id()
