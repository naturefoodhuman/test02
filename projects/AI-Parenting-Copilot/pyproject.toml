[project]
name = "ai-parenting-copilot"
version = "0.1.0"
description = "Local-first AI parenting copilot server and app."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "AI Parenting Copilot Maintainers" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "python-ulid>=3.0",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "SQLAlchemy>=2.0",
  "aiomqtt>=2.3",
  "Pillow>=10.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests requiring external services such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["server/app"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["tests*", "config*", "deploy*", "android*", "firmware*", "runtime*"]
